<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJAY GIRISH | Admin Control Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="admin.css" />
</head>
<body>
    <!-- Background Ambient Orbs -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <!-- Passcode Authentication Lock Screen -->
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-card">
            <div class="lock-icon">
                <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h2>Admin Control Hub</h2>
            <p>Enter 4-digit master passcode to access site controls</p>
            
            <div class="pin-input-group">
                <input type="password" maxlength="1" class="pin-digit" autofocus />
                <input type="password" maxlength="1" class="pin-digit" />
                <input type="password" maxlength="1" class="pin-digit" />
                <input type="password" maxlength="1" class="pin-digit" />
            </div>

            <button class="btn-primary" id="loginBtn">
                Unlock Dashboard
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>

            <div class="auth-error" id="authError"></div>
        </div>
    </div>

    <!-- Main Dashboard UI -->
    <div class="app-wrapper">
        <!-- Top Navbar -->
        <nav class="navbar">
            <div class="brand">
                <div class="brand-icon">AG</div>
                <div>
                    <div class="brand-title">AJAY GIRISH</div>
                    <div class="brand-subtitle">Private Management Portal</div>
                </div>
            </div>
            <div class="nav-actions">
                <button class="btn-secondary" onclick="changePin()">
                    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.778-7.778zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg>
                    Change PIN
                </button>
                <button class="btn-secondary" onclick="logoutAdmin()">
                    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    Lock
                </button>
            </div>
        </nav>

        <!-- Main Dashboard Grid -->
        <div class="dashboard-grid">
            <!-- Left Sidebar Controls -->
            <aside class="sidebar">
                <!-- Status Card -->
                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-title">
                            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                            Website Status
                        </span>
                    </div>

                    <div class="status-card">
                        <div class="status-pill" id="statusPill">
                            <div class="dot-pulse"></div> Checking...
                        </div>
                        <p class="status-desc" id="statusDesc">Fetching current website state...</p>
                    </div>

                    <div class="action-buttons" id="toggleBtnContainer">
                        <!-- Switcher populated by JS -->
                    </div>
                </div>

                <!-- GitHub Cloud Integration -->
                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-title">
                            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
                            GitHub Integration
                        </span>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Personal Access Token (PAT)</label>
                        <input type="password" class="form-control" id="githubPat" placeholder="ghp_xxxxxxxxxxxx" />
                    </div>

                    <button class="btn-secondary" style="width:100%; justify-content:center;" id="savePatBtn">
                        Save Token Locally
                    </button>
                </div>

                <!-- Domain Info -->
                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-title">
                            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                            Live Domain
                        </span>
                    </div>
                    <p style="font-family: var(--font-mono); font-size: 0.85rem; color: var(--accent-cyan);">
                        https://ajaygirish.me
                    </p>
                </div>
            </aside>

            <!-- Right Main Area: Live Site Preview -->
            <main class="main-content">
                <div class="panel" style="margin-bottom:0; height: 100%;">
                    <div class="panel-header">
                        <span class="panel-title">
                            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                            Interactive Viewport Preview
                        </span>
                    </div>

                    <div class="tabs-header">
                        <button class="tab-btn active" data-src="index.html">
                            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            Current Public View (index.html)
                        </button>
                        <button class="tab-btn" data-src="index_full.html">
                            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                            Full Portfolio View (index_full.html)
                        </button>
                    </div>

                    <div class="preview-container">
                        <iframe class="preview-iframe" id="previewIframe" src="index.html"></iframe>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="admin.js"></script>
</body>
</html>
